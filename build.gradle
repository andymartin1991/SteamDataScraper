plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

group = 'com.steamscraper'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0' 
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'steam.SteamScraper'
}

// --- TAREAS DE RECOLECCIÓN ---
tasks.register('runCollector', JavaExec) {
    group = "1. Recolección"
    description = "Ejecuta el SteamRawCollector con soporte SQLite"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('steam.SteamRawCollector')
}

tasks.register('runRawgCollector', JavaExec) {
    group = "1. Recolección"
    description = "Ejecuta el RAWGRawCollector con soporte SQLite"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('rawg.RAWGRawCollector')
}

tasks.register('runRawgDetailCollector', JavaExec) {
    group = "1. Recolección"
    description = "Descarga los detalles (descripción, etc) de los juegos de RAWG"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('rawg.RAWGDetailCollector')
}

// --- TAREAS DE PROCESADO (SCRAPING) ---
tasks.register('runScraper', JavaExec) {
    group = "2. Procesado"
    description = "Ejecuta el SteamScraper para procesar el JSON de Steam"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('steam.SteamScraper')
}

tasks.register('runRawgScraper', JavaExec) {
    group = "2. Procesado"
    description = "Ejecuta el RAWGScraper para procesar el JSON de RAWG"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('rawg.RAWGScraper')
}

// --- TAREA DE UNIFICACIÓN GLOBAL ---
tasks.register('runGlobalUnion', JavaExec) {
    group = "3. Unificación"
    description = "Unifica los JSON de Steam y RAWG en un archivo global"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('union.GlobalUnion')
}


// -------------------------------------------------

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.register('runSteamReleaseDateUpdater', JavaExec) {
    group = "1. Recolección"
    description = "Revisa únicamente fechas pendientes, TBA o futuras de Steam"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('steam.SteamReleaseDateUpdater')
    systemProperty 'release.update.limit', System.getProperty('release.update.limit', '1000')
}

tasks.register('runRawgReleaseDateUpdater', JavaExec) {
    group = "1. Recolección"
    description = "Revisa únicamente fechas pendientes, TBA o futuras de RAWG"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('rawg.RAWGReleaseDateUpdater')
    systemProperty 'release.update.limit', System.getProperty('release.update.limit', '1000')
}

tasks.register('runSteamUpcomingScraper', JavaExec) {
    group = "2. Procesado"
    description = "Exporta los próximos lanzamientos de Steam"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('steam.SteamUpcomingScraper')
}

tasks.register('runRawgUpcomingScraper', JavaExec) {
    group = "2. Procesado"
    description = "Exporta los próximos lanzamientos de RAWG"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('rawg.RAWGUpcomingScraper')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaExec).configureEach {
    workingDir = projectDir
}

